name: Build and deploy JAR app to Azure Web App - appISW23

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests

      - name: List JARs for debugging
        run: ls -l target/*.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_72D4154BC5E249D798089F464103D742 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8BF0AA08C31547EABE9755C082F046AB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D3E145F9315C44BDA1B5059A11C193F6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appISW23'
          slot-name: 'Production'
          package: 'target/*.jar'
